name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VER_STR" ]; then
            echo "ERROR: Unable to detect Java version from output."
            exit 1
          fi

          JAVA_MAJOR=$(echo "$JAVA_VER_STR" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java Major Version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ] || ! [ "$JAVA_MAJOR" -ge 17 ] 2>/dev/null; then
            echo "ERROR: Java version 17 or higher is required. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java version verification passed ($JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in workspace."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to generate temporary debug.keystore."
              exit 1
            fi
            echo "Temporary debug keystore generated successfully."
          fi

      - name: Build debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at: $EXPECTED_APK"
            echo "Searching app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -type f
            else
              echo "app/build/outputs/apk directory does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file is empty: $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: File does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          echo "APK verified successfully: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleEnglishBuddy-v1.0-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          TMP_DIR="${{ runner.temp }}/release_asset"
          mkdir -p "$TMP_DIR"

          ASSET_NAME="LittleEnglishBuddy-v1.0.apk"
          ASSET_PATH="${TMP_DIR}/${ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Release asset prepared: $ASSET_PATH ($ASSET_NAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset missing or empty at $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not have .apk extension"
              exit 1
              ;;
          esac

          TAG_NAME="v1.0-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Little English Buddy v1.0 (Build #${{ github.run_number }})"

          cat << 'EOF' > /tmp/release_notes.md
          ### 📱 Little English Buddy - Android APK Release

          Download the official installable APK for **Little English Buddy**!

          - **App Name**: Little English Buddy
          - **Version**: `1.0`
          - **Build / Run Number**: `${{ github.run_number }}`
          - **Final APK File**: `${{ steps.prepare_asset.outputs.asset_name }}`
          - **Application ID**: `com.aistudio.babyworld.toddler`
          - **Source Commit SHA**: `${{ github.sha }}`

          ---
          #### 📥 How to Install:
          1. Under **Assets** below, tap or click **`LittleEnglishBuddy-v1.0.apk`** to download.
          2. Open the downloaded file on your Android device (Android 7.0+ / API 24+ supported).
          3. Enjoy learning with Little English Buddy!
          EOF

          gh release create "$TAG_NAME" \
            "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            --latest

          echo "Release successfully created with tag $TAG_NAME"
          echo "release_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Summary ==="
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG_NAME="v1.0-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_TITLE="Little English Buddy v1.0 (Build #${{ github.run_number }})"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"

            echo "GitHub Release published successfully!"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            gh release view "$TAG_NAME" || true

            {
              echo "## 🚀 Little English Buddy APK Build & Release Successful"
              echo ""
              echo "- **Release Page**: [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Release Tag**: \`$TAG_NAME\`"
              echo "- **Downloadable APK Asset**: \`$ASSET_NAME\`"
              echo ""
              echo "📱 **How to Download & Install:**"
              echo "1. Open the [Release Page]($RELEASE_URL)."
              echo "2. Under **Assets**, click on \`$ASSET_NAME\` to download the APK directly to your phone."
              echo "3. Open and install the APK on your Android device."
              echo ""
              echo "📦 **Backup Actions Artifact:**"
              echo "The standard GitHub Actions artifact named \`LittleEnglishBuddy-v1.0-apk\` is also preserved in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Release publishing step did not succeed."
            echo "APK compilation and validation succeeded."
            echo "Actions artifact 'LittleEnglishBuddy-v1.0-apk' remains available for download."

            {
              echo "## ⚠️ APK Built (Actions Artifact Available)"
              echo ""
              echo "- **APK Build Status**: ✅ Succeeded (\`LittleEnglishBuddy-v1.0.apk\`)"
              echo "- **GitHub Release Publishing**: ⚠️ Skipped or encountered an error"
              echo ""
              echo "📦 **How to Download the APK Artifact:**"
              echo "The compiled APK is available as a GitHub Actions artifact."
              echo "1. Scroll down to the **Artifacts** section of this workflow run summary."
              echo "2. Download \`LittleEnglishBuddy-v1.0-apk\` to retrieve the compiled APK."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
